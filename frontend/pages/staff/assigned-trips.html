<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Shifts & Trips — BONHAGAN TRANSIT</title>
    <link rel="icon" type="image/png" href="../../assets/images/logo/bonhagan-logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="staff-layout">

    <header class="staff-header">
        <div class="staff-brand">
            <a href="dashboard.html" style="color:#FFF; text-decoration:none; font-size:1.1rem; margin-right:8px;" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="staff-title">
                ASSIGNED SHIFTS
                <small>DAILY ROSTER & COACH ALLOCATIONS</small>
            </div>
        </div>
        <button id="btn-refresh-trips" class="btn btn-outline btn-sm" style="color:#FFF; border-color:rgba(255,255,255,0.3); font-size:0.75rem;"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </header>

    <main class="staff-main">
        <div class="portal-card">
            <h2 class="portal-card-title mb-4">Route 6 Conductor Shift Schedule</h2>

            <div id="assigned-loading" style="display: flex; flex-direction: column; gap: var(--space-4);">
                <span class="skeleton skeleton-shift-item"></span>
                <span class="skeleton skeleton-shift-item"></span>
                <span class="skeleton skeleton-shift-item"></span>
            </div>

            <div id="assigned-list" style="display: flex; flex-direction: column; gap: var(--space-4);">
                <!-- Populated via API -->
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="staff-bottom-nav">
        <a href="dashboard.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
            <span>Home</span>
        </a>
        <a href="assigned-trips.html" class="staff-nav-btn active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
            <span>Trips</span>
        </a>
        <a href="qr-scanner.html" class="staff-nav-btn staff-scan-highlight" title="Scan QR Code">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 2V5h1v1H5zM3 13a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3zm2 2v-1h1v1H5zM13 3a1 1 0 00-1 1v3a1 1 0 001 1h3a1 1 0 001-1V4a1 1 0 00-1-1h-3zm1 2v1h1V5h-1z" clip-rule="evenodd"/></svg>
        </a>
        <a href="passenger-manifest.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
            <span>Manifest</span>
        </a>
        <a href="incidents.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            <span>Incidents</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="../../js/config/api-config.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/dom.js"></script>
    <script src="../../js/utils/formatting.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/core/theme.js"></script>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/api.js"></script>
    <script src="../../js/core/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.protectPage(['staff', 'admin']);
            if (!user) return;

            loadTrips();
            document.getElementById('btn-refresh-trips').addEventListener('click', loadTrips);
        });

        async function loadTrips() {
            const loading = document.getElementById('assigned-loading');
            const list = document.getElementById('assigned-list');

            loading.style.display = 'block';
            list.innerHTML = '';

            try {
                const res = await Api.get(API_CONFIG.ENDPOINTS.STAFF.ASSIGNED_TRIPS);
                loading.style.display = 'none';

                if (res.success && res.data && res.data.length > 0) {
                    list.innerHTML = res.data.map(t => {
                        const isAircon = ((t.bus_type_code || t.bus_type || '').toLowerCase()).includes('air');
                        return `
                            <div style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-4); box-shadow: var(--shadow-sm);">
                                <div>
                                    <div class="d-flex items-center gap-2 mb-1">
                                        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin: 0;">${DOM.escapeHtml(t.bus_number || 'BTH-101')}</h3>
                                        <span class="bus-type-pill ${isAircon ? 'aircon' : 'ordinary'}">${isAircon ? '<i class="fa-solid fa-snowflake"></i> Aircon' : '<i class="fa-solid fa-wind"></i> Ordinary'}</span>
                                        <span class="status-pill scheduled">${DOM.escapeHtml(t.status || 'SCHEDULED')}</span>
                                    </div>
                                    <div style="font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px;">
                                        ${DOM.escapeHtml(t.origin_name || 'Monumento')} <i class="fa-solid fa-arrow-right" style="margin: 0 4px; font-size: 0.85em;"></i> ${DOM.escapeHtml(t.destination_name || 'Sapang Palay')}
                                    </div>
                                    <span style="font-size: 0.8rem; color: var(--text-muted);">
                                        Departure: <strong>${FormatUtil.time(t.departure_time)}</strong> • Plate: <strong>${DOM.escapeHtml(t.plate_number || 'NA')}</strong>
                                    </span>
                                </div>

                                <div class="d-flex gap-2">
                                    <a href="passenger-manifest.html?trip_id=${t.trip_id}" class="btn btn-outline btn-sm">View Manifest</a>
                                    <a href="qr-scanner.html?trip_id=${t.trip_id}" class="btn btn-primary btn-sm">Launch Scanner</a>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No shifts currently scheduled for your profile.</p>`;
                }
            } catch (e) {
                loading.style.display = 'none';
                Toast.error('Failed to load trips.');
            }
        }
    </script>
</body>
</html>
