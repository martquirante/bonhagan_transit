<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident / Delay — BONHAGAN TRANSIT</title>
    <link rel="icon" type="image/png" href="../../assets/images/logo/bonhagan-logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="staff-layout">

    <header class="staff-header">
        <div class="staff-brand">
            <a href="dashboard.html" style="color:#FFF; text-decoration:none; font-size:1.1rem; margin-right:8px;" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="staff-title">
                REPORT ON-ROUTE INCIDENT
                <small>DISPATCH & SAFETY TELEMETRY</small>
            </div>
        </div>
    </header>

    <main class="staff-main">
        <div class="portal-card">
            <h2 class="portal-card-title mb-1">Log Shift Incident or Highway Delay</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: var(--space-6);">
                Immediately notifies central terminal dispatch and logs route telemetry.
            </p>

            <form id="incident-report-form">
                <div class="form-group">
                    <label class="form-label" for="inc-trip-id">Active Trip / Bus Run</label>
                    <select id="inc-trip-id" class="form-control form-select" required>
                        <!-- Populated via API -->
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="inc-type">Incident Category</label>
                    <select id="inc-type" class="form-control form-select" required>
                        <option value="traffic_delay">Severe Traffic Delay (EDSA / Quirino Highway)</option>
                        <option value="mechanical">Mechanical Issue / Aircon Malfunction</option>
                        <option value="accident">Minor Collision / Road Hazard</option>
                        <option value="passenger_dispute">Passenger Dispute / Ticket Irregularity</option>
                        <option value="medical">Medical Assistance Required</option>
                        <option value="weather">Flash Flood / Torrential Rain Delay</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="inc-location">Approximate Road Location / Nearest Landmark</label>
                    <input type="text" id="inc-location" class="form-control" placeholder="e.g. Near SM San Jose del Monte or Novaliches Bayan" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="inc-desc">Incident Description & Immediate Actions Taken</label>
                    <textarea id="inc-desc" class="form-control" rows="4" placeholder="Detail any delay duration, passenger status, or emergency services contacted..." required></textarea>
                </div>

                <button type="submit" id="btn-submit-incident" class="btn btn-primary w-100" style="height: 46px; font-weight: 700;">
                    Submit Report to Central Dispatch
                </button>
            </form>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="staff-bottom-nav">
        <a href="dashboard.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
            <span>Home</span>
        </a>
        <a href="assigned-trips.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
            <span>Trips</span>
        </a>
        <a href="qr-scanner.html" class="staff-nav-btn staff-scan-highlight" title="Scan QR Code">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 2V5h1v1H5zM3 13a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3zm2 2v-1h1v1H5zM13 3a1 1 0 00-1 1v3a1 1 0 001 1h3a1 1 0 001-1V4a1 1 0 00-1-1h-3zm1 2v1h1V5h-1z" clip-rule="evenodd"/></svg>
        </a>
        <a href="passenger-manifest.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
            <span>Manifest</span>
        </a>
        <a href="incidents.html" class="staff-nav-btn active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            <span>Incidents</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="../../js/config/api-config.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/dom.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/core/theme.js"></script>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/api.js"></script>
    <script src="../../js/core/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.protectPage(['staff', 'admin']);
            if (!user) return;

            // Load trips
            const tripSelect = document.getElementById('inc-trip-id');
            try {
                const res = await Api.get(API_CONFIG.ENDPOINTS.STAFF.ASSIGNED_TRIPS);
                if (res.success && res.data && res.data.length > 0) {
                    tripSelect.innerHTML = res.data.map(t => `
                        <option value="${t.trip_id}">
                            ${DOM.escapeHtml(t.bus_number || 'Bus')} (${DOM.escapeHtml(t.origin_name || 'Monumento')} → ${DOM.escapeHtml(t.destination_name || 'Sapang Palay')})
                        </option>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
            }

            // Submit Incident
            document.getElementById('incident-report-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-submit-incident');
                DOM.setLoading(btn, true, 'Submitting Report...');

                const payload = {
                    trip_id: tripSelect.value,
                    incident_type: document.getElementById('inc-type').value,
                    location: document.getElementById('inc-location').value.trim(),
                    description: document.getElementById('inc-desc').value.trim()
                };

                try {
                    const res = await Api.post(API_CONFIG.ENDPOINTS.STAFF.REPORT_INCIDENT, payload);
                    if (res.success) {
                        Toast.success('Incident transmitted to central dispatch.');
                        document.getElementById('incident-report-form').reset();
                    } else {
                        Toast.error(res.message || 'Failed to submit incident.');
                    }
                } catch (err) {
                    Toast.error('Network error filing incident.');
                } finally {
                    DOM.setLoading(btn, false, 'Submit Report to Central Dispatch');
                }
            });
        });
    </script>
</body>
</html>
