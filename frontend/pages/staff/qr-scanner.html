<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Boarding Scanner — BONHAGAN TRANSIT</title>
    <link rel="icon" type="image/png" href="../../assets/images/logo/bonhagan-logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../css/main.css">
    <!-- HTML5 QR Code Camera Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .scanner-viewport-box {
            background: #000000;
            border-radius: var(--radius-xl);
            overflow: hidden;
            position: relative;
            min-height: 280px;
            box-shadow: var(--shadow-lg);
        }
        #reader {
            width: 100%;
        }
        .scan-target-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px dashed var(--color-accent-amber);
            border-radius: var(--radius-lg);
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        .scan-laser-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--color-accent-amber);
            box-shadow: 0 0 8px #F59E0B;
            animation: scanAnim 2s infinite alternate ease-in-out;
        }
        @keyframes scanAnim {
            0% { top: 10%; }
            100% { top: 90%; }
        }
    </style>
</head>
<body class="staff-layout">

    <header class="staff-header">
        <div class="staff-brand">
            <a href="dashboard.html" style="color:#FFF; text-decoration:none; font-size:1.1rem; margin-right:8px;" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="staff-title">
                PASSENGER QR SCANNER
                <small>RAPID BOARDING VERIFICATION</small>
            </div>
        </div>
        <span class="staff-badge-status" id="camera-status-indicator"><i class="fa-solid fa-camera"></i> CAMERA READY</span>
    </header>

    <main class="staff-main">
        <!-- Live Scanner Viewport -->
        <div class="scanner-viewport-box mb-4">
            <div id="reader"></div>
            <div class="scan-target-frame">
                <div class="scan-laser-line"></div>
            </div>
        </div>

        <!-- Scan Result Feedback Card (Dynamic) -->
        <div id="scan-feedback-container" style="display: none; margin-bottom: var(--space-4);">
            <!-- Populated via JS on scan -->
        </div>

        <!-- Manual Token Entry Option -->
        <div class="portal-card" style="padding: var(--space-4);">
            <h3 style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary); margin-bottom: var(--space-2);">
                Manual Token / Ticket Reference Input
            </h3>
            <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: var(--space-3);">
                If passenger's screen is dimmed or QR code cannot be read by camera:
            </p>
            <form id="manual-token-form" class="d-flex gap-2">
                <input type="text" id="manual-token-input" class="form-control" placeholder="Enter validation token or ticket ID..." style="height: 42px; font-family: var(--font-mono); font-size: 0.85rem;" required>
                <button type="submit" id="btn-submit-token" class="btn btn-primary" style="height: 42px; font-weight: 700; white-space: nowrap;">
                    Verify Boarding
                </button>
            </form>
        </div>

        <!-- Recent Validations Feed -->
        <div class="portal-card" style="padding: var(--space-4);">
            <div class="d-flex justify-between items-center mb-3">
                <h4 style="font-size: 0.9rem; font-weight: 700; margin: 0; color: var(--text-primary);">Recent Scans This Shift</h4>
                <span id="scan-counter" class="badge badge-info">0 Verified</span>
            </div>
            <div id="recent-scans-list" style="display: flex; flex-direction: column; gap: var(--space-2);">
                <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin: var(--space-3) 0;">No passengers verified yet this session.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="staff-bottom-nav">
        <a href="dashboard.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
            <span>Home</span>
        </a>
        <a href="assigned-trips.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
            <span>Trips</span>
        </a>
        <a href="qr-scanner.html" class="staff-nav-btn staff-scan-highlight active" title="Scan QR Code">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm2 2V5h1v1H5zM3 13a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3zm2 2v-1h1v1H5zM13 3a1 1 0 00-1 1v3a1 1 0 001 1h3a1 1 0 001-1V4a1 1 0 00-1-1h-3zm1 2v1h1V5h-1z" clip-rule="evenodd"/></svg>
        </a>
        <a href="passenger-manifest.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
            <span>Manifest</span>
        </a>
        <a href="incidents.html" class="staff-nav-btn">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            <span>Incidents</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="../../js/config/api-config.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/dom.js"></script>
    <script src="../../js/utils/formatting.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/core/theme.js"></script>
    <script src="../../js/core/session.js"></script>
    <script src="../../js/core/api.js"></script>
    <script src="../../js/core/auth.js"></script>
    <script src="../../js/core/router.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.protectPage(['staff', 'admin']);
            if (!user) return;

            const tripId = Router.getParam('trip_id');
            let isScanning = true;
            let verifiedCount = 0;
            const recentScans = [];

            // Setup camera scanner
            let html5QrCode = null;
            try {
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 220, height: 220 } };

                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText) => {
                        if (isScanning) {
                            handleTicketToken(decodedText);
                        }
                    },
                    (errorMessage) => {
                        // ignore frame misses
                    }
                ).catch(err => {
                    document.getElementById('camera-status-indicator').textContent = '<i class="fa-solid fa-triangle-exclamation"></i> CAMERA OFFLINE';
                    document.getElementById('camera-status-indicator').style.color = '#F87171';
                });
            } catch (e) {
                console.warn('QR Camera initialization error:', e);
            }

            // Handle Manual Token Submission
            document.getElementById('manual-token-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const token = document.getElementById('manual-token-input').value.trim();
                if (token) {
                    handleTicketToken(token);
                    document.getElementById('manual-token-input').value = '';
                }
            });

            async function handleTicketToken(token) {
                isScanning = false;
                const feedback = document.getElementById('scan-feedback-container');

                try {
                    const res = await Api.post(API_CONFIG.ENDPOINTS.TICKETS.VALIDATE, {
                        token: token,
                        trip_id: tripId
                    });

                    feedback.style.display = 'block';

                    if (res.success && res.data) {
                        const t = res.data;
                        verifiedCount++;
                        document.getElementById('scan-counter').textContent = `${verifiedCount} Verified`;

                        feedback.innerHTML = `
                            <div style="background-color: var(--color-success-bg); border: 2px solid var(--color-success); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; align-items: center; justify-content: space-between;">
                                <div>
                                    <div class="badge badge-success mb-1"><i class="fa-solid fa-check-circle"></i> BOARDING GRANTED</div>
                                    <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin: 0;">${DOM.escapeHtml(t.passenger_name || 'Passenger')}</h3>
                                    <span style="font-size: 0.8rem; color: var(--color-success); font-weight: 600;">Route: ${DOM.escapeHtml(t.origin_name || 'Monumento')} → ${DOM.escapeHtml(t.destination_name || 'Sapang Palay')}</span>
                                </div>
                                <div style="text-align: right;">
                                    <span style="font-size: 0.7rem; color: var(--color-success); font-weight: 700; text-transform: uppercase;">SEAT</span>
                                    <div style="font-size: 2rem; font-weight: 900; color: var(--color-success); font-family: var(--font-mono); line-height: 1;">
                                        ${DOM.escapeHtml(t.seat_number || '1A')}
                                    </div>
                                </div>
                            </div>
                        `;

                        // Add to recent list
                        addRecentScan(t, true);
                        Toast.success(`Boarding verified: Seat ${t.seat_number}`);
                    } else {
                        feedback.innerHTML = `
                            <div style="background-color: var(--color-danger-bg); border: 2px solid var(--color-danger); border-radius: var(--radius-lg); padding: var(--space-4);">
                                <div class="badge badge-danger mb-1"><i class="fa-solid fa-circle-xmark"></i> BOARDING DENIED</div>
                                <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--color-danger); margin: 0;">${DOM.escapeHtml(res.message || 'Invalid or Expired Token')}</h3>
                                <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 4px 0 0 0;">This pass cannot be boarded. Check booking status or passenger ID.</p>
                            </div>
                        `;
                        Toast.error(res.message || 'Boarding denied.');
                    }
                } catch (e) {
                    feedback.style.display = 'block';
                    feedback.innerHTML = `
                        <div style="background-color: var(--color-danger-bg); border: 1px solid var(--color-danger); border-radius: var(--radius-lg); padding: var(--space-4); color: #991B1B;">
                            <strong>Validation network error.</strong> Please retry.
                        </div>
                    `;
                }

                // Resume camera scanning after 2.5s
                setTimeout(() => {
                    isScanning = true;
                }, 2500);
            }

            function addRecentScan(t, isValid) {
                const list = document.getElementById('recent-scans-list');
                const row = document.createElement('div');
                row.style.cssText = 'background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem;';
                row.innerHTML = `
                    <div>
                        <strong style="color: var(--text-primary);">${DOM.escapeHtml(t.passenger_name || 'Passenger')}</strong>
                        <span style="color: var(--text-muted); font-size: 0.72rem; display: block;">${new Date().toLocaleTimeString()}</span>
                    </div>
                    <span class="badge badge-info" style="font-family: var(--font-mono); font-size: 0.85rem;">Seat ${DOM.escapeHtml(t.seat_number || '—')}</span>
                `;
                if (list.querySelector('p')) {
                    list.innerHTML = '';
                }
                list.prepend(row);
            }
        });
    </script>
</body>
</html>
