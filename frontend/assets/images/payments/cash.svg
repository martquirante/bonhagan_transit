<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="cash-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold-seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="80" height="80" rx="18" fill="url(#cash-emerald)"/>
  <rect x="2" y="2" width="76" height="76" rx="16" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Banknote Silhouette -->
  <rect x="12" y="22" width="56" height="36" rx="6" fill="#065F46" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="12" fill="url(#gold-seal)"/>
  <circle cx="40" cy="40" r="10" fill="#065F46"/>
  <!-- Philippine Peso Currency Symbol -->
  <text x="40" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FCD34D" text-anchor="middle">₱</text>

  <!-- Corner banknote details -->
  <circle cx="19" cy="29" r="2.5" fill="#A7F3D0"/>
  <circle cx="61" cy="29" r="2.5" fill="#A7F3D0"/>
  <circle cx="19" cy="51" r="2.5" fill="#A7F3D0"/>
  <circle cx="61" cy="51" r="2.5" fill="#A7F3D0"/>
</svg>
