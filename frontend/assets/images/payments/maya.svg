<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="maya-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="maya-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00D665"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="80" height="80" rx="18" fill="url(#maya-dark)"/>
  <rect x="2" y="2" width="76" height="76" rx="16" fill="none" stroke="url(#maya-green)" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Maya Wordmark / Stylized Glyph -->
  <g transform="translate(14, 25)">
    <!-- 'm' letterform -->
    <path d="M0 24 L0 7.5 C0 3.5 3 0.5 7 0.5 C10.8 0.5 13.8 3.2 14.5 7 C15.5 3 18.8 0.5 22.8 0.5 C27.5 0.5 31 4 31 8.8 L31 24 L24.5 24 L24.5 9.5 C24.5 7.2 23 5.8 21 5.8 C19 5.8 17.5 7.2 17.5 9.5 L17.5 24 L11 24 L11 9.5 C11 7.2 9.5 5.8 7.5 5.8 C5.5 5.8 4 7.2 4 9.5 L4 24 Z" fill="url(#maya-green)"/>
    <!-- 'aya' continuation or signature green dot -->
    <circle cx="43" cy="18" r="4.5" fill="#00FFA3"/>
  </g>
  <!-- Modern subtitle in white -->
  <text x="40" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#00FFA3" letter-spacing="1.5" text-anchor="middle">MAYA</text>
